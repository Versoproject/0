<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyboard speed test</title>
<!-- [Zzz14-B11:VKB-BARE] TEMPORARY speed test (Vrso 2026-10-21 15:08: "ci az tak spomaluje web klavesnica?"): the same kind of
     on-screen keyboard as Verso, on an empty page. Fast here + slow in Verso = the Verso page is the cause; slow here too =
     the phone / browser. Delete after the test (BL). -->
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f5; }
  textarea { box-sizing: border-box; width: calc(100% - 24px); margin: 12px; height: 90px; font-size: 18px; border: 2px solid #D4AF37; border-radius: 10px; padding: 8px; }
  #m { margin: 0 12px; font: 700 14px system-ui; color: #444; }
  #kb { position: fixed; left: 4px; right: 4px; bottom: 4px; background: #171717; border: 2px solid #D4AF37; border-radius: 12px; padding: 6px; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .r { display: flex; gap: 4px; margin-bottom: 4px; } .r2 { padding: 0 5%; }
  button { flex: 1 1 0; height: 48px; border-radius: 6px; border: 1px solid #3f3f46; background: #262626; color: #fff; font-size: 20px; font-weight: 600; touch-action: none; -webkit-tap-highlight-color: transparent; }
  button.dn { background: #3f3f46; } .w { flex: 1.5 1 0; } .sp { flex: 4 1 0; }
  label { color: #ccc; font-size: 13px; margin: 0 6px; }
</style></head><body>
<textarea id="t" inputmode="none" spellcheck="false" placeholder="type here with the keys below"></textarea>
<div id="m">⏱ –</div>
<div id="kb"><div class="r"><label><input type="checkbox" id="vib" checked> vibration</label></div></div>
<script>
const t = document.getElementById('t'), kb = document.getElementById('kb'), m = document.getElementById('m'), vib = document.getElementById('vib');
const rows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
const wait = [], show = [];
const avg = (a) => Math.round(a.reduce((x, y) => x + y, 0) / a.length);
function key(row, label, fn, cls) {
  const b = document.createElement('button'); b.type = 'button'; b.tabIndex = -1; b.textContent = label; if (cls) b.className = cls;
  b.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const tIn = performance.now(), t0 = e.timeStamp > 0 && e.timeStamp <= tIn ? e.timeStamp : tIn;
    if (vib.checked && navigator.vibrate) navigator.vibrate(12);
    b.classList.add('dn'); fn();
    requestAnimationFrame(() => setTimeout(() => {
      wait.push(tIn - t0); show.push(performance.now() - t0); if (wait.length > 10) { wait.shift(); show.shift(); }
      m.textContent = '⏱ ' + avg(wait) + ' / ' + avg(show) + ' ms (empty test page)';
    }, 0));
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, () => b.classList.remove('dn')));
  row.appendChild(b);
}
const ins = (s) => { t.focus(); if (!document.execCommand('insertText', false, s)) t.setRangeText(s, t.selectionStart, t.selectionEnd, 'end'); };
rows.forEach((r, i) => {
  const d = document.createElement('div'); d.className = 'r' + (i === 1 ? ' r2' : ''); kb.appendChild(d);
  if (i === 2) key(d, '⇧', () => {}, 'w');
  r.split('').forEach(c => key(d, c, () => ins(c)));
  if (i === 2) key(d, '⌫', () => { t.focus(); document.execCommand('delete', false); }, 'w');
});
const d = document.createElement('div'); d.className = 'r'; kb.appendChild(d);
key(d, ',', () => ins(',')); key(d, 'space', () => ins(' '), 'sp'); key(d, '.', () => ins('.'));
kb.addEventListener('pointerdown', (e) => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'LABEL' && e.cancelable) e.preventDefault(); }, true);
t.focus();
</script></body></html>
