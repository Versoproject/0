<!-- zzz2-M1 layout modul - CSS pre sekcie (CORE/SYSTEM/DATA/WORKSPACE) | Vrso -> Claude AI | 2026-08-16 -->
<style>
  .section {
    margin-bottom: 12px;
  }
  .top-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 8px 6px 0 6px;
  }
  .section-core, .section-system {
    flex-shrink: 0;
  }
  .section-data {
    flex-shrink: 1;
    padding-top: 4px;
  }
  .section-workspace {
    display: block;
  }

  .circle-layout {
    position: relative;
    width: 168px;
    height: 140px;
  }
  .circle-layout .circle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background-color: #0a0a0a;
    background-image: url("verso-chain.jpg");
    background-size: cover;
    background-position: center;
    border: none;
    cursor: pointer;
  }
  .section-core .circle {
    width: 80px;
    height: 80px;
  }
  .section-system .circle-layout {
    width: 180px;
    height: 140px;
  }
  .section-system .circle {
    width: 64px;
    height: 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    color: #fff;
    font-size: 8px;
    font-weight: 700;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
  }

  .circle-layout button {
    position: absolute;
    top: 50%;
    left: 50%;
    height: 22px;
    padding: 0 4px;
    border-radius: 5px;
    background-color: #171717;
    border: none;
    color: #fff;
    font-size: 7px;
    font-weight: 700;
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .section-core .pos-top        { transform: translate(-50%, -50%) translate(0px, -62px); }
  .section-core .pos-top-right  { transform: translate(-50%, -50%) translate(46px, -46px); }
  .section-core .pos-right      { transform: translate(-50%, -50%) translate(62px, 0px); }
  .section-core .pos-bottom-right { transform: translate(-50%, -50%) translate(46px, 46px); }
  .section-core .pos-bottom     { transform: translate(-50%, -50%) translate(0px, 62px); }
  .section-core .pos-bottom-left  { transform: translate(-50%, -50%) translate(-46px, 46px); }
  .section-core .pos-left       { transform: translate(-50%, -50%) translate(-62px, 0px); }
  .section-core .pos-top-left   { transform: translate(-50%, -50%) translate(-46px, -46px); }

  .section-system .pos-top        { transform: translate(-50%, -50%) translate(0px, -54px); }
  .section-system .pos-top-right  { transform: translate(-50%, -50%) translate(50px, -42px); }
  .section-system .pos-right      { transform: translate(-50%, -50%) translate(68px, 0px); }
  .section-system .pos-bottom-right { transform: translate(-50%, -50%) translate(50px, 42px); }
  .section-system .pos-bottom     { transform: translate(-50%, -50%) translate(0px, 54px); }
  .section-system .pos-bottom-left  { transform: translate(-50%, -50%) translate(-50px, 42px); }
  .section-system .pos-left       { transform: translate(-50%, -50%) translate(-68px, 0px); }
  .section-system .pos-top-left   { transform: translate(-50%, -50%) translate(-50px, -42px); }

  .section-system .pos-top-right {
    visibility: visible;
  }

  .data-row {
    display: flex;
    flex-wrap: nowrap;
    gap: 4px;
  }
  .data-row button {
    height: 32px;
    padding: 0 6px;
    border-radius: 6px;

<script>
const SUPABASE_URL = "https://piywybkxbupqaecdcrar.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ps48H6-NCGe0-KaHbiijIw_YYatFp4K";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// === [F1:CELL-LOGIC] centralny data store + render + klik-modal pre R1 (Entry Number), R2 (Project Number), R3 (Project Name) a R4 (Project Owner) bunky ===
// R2, R3 a R4 pouzivaju rovnaky generic write_to_entry/render_entry_cell/open_entry_modal ako R1 (DRY, ziadna nova logika).
// POZOR: submit_entries_to_db() (Zzz1-D1) zatial zapisuje do Supabase LEN stlpec r1 (Entry Number).
// R2 (Project Number), R3 (Project Name) a R4 (Project Owner) sa zapisuju len lokalne do entryData/bunky -
// napojenie na DB (nove stlpce, napr. r2, r3, r4) je dalsi krok, rovnako ako pri dalsich buducich command line
// bunkach (viz komentar pri Zzz1-D1 nizsie).
const entryData = { "1": "", "2": "", "3": "", "4": "" };

// === zzz2-R29 fix: samostatna cache SKUTOCNE ULOZENYCH zaznamov (nie live-pisany obsah R1) ===
// Predtym Database workspace citala priamo z entryData -> ked si vyprazdnil/prepisal R1 (napr. kvoli hladaniu),
// zmizol aj samotny "ulozeny" zaznam, lebo bol to isty field. Teraz: R1 = LEN filter/live editacia,
// submittedEntriesCache = to, co bolo skutocne odoslane cez submit_entries_to_db (Enter mimo textarea / podrzanie loga).
const submittedEntriesCache = {};

function render_entry_cell(id) {
  const cell = document.querySelector(`.entry-cell[data-entry-id="${id}"]`);
  if (!cell) return;
  cell.textContent = entryData[id] || "";
}

function write_to_entry(id, text) {
  entryData[id] = text;
  render_entry_cell(id);
  // zzz2-R29: ulozenie v modali (ULOZIT) rovno odosle zaznam do "databazy" (lokalna cache + Supabase pokus),
  // takze nie je treba osobitne Enter/podrzanie loga len preto, aby sa zaznam objavil v Database workspace.
  submit_entries_to_db();
  // ak je Database workspace prave otvoreny, R1 bunka funguje ako filter -> obnov zoznam
  refresh_database_workspace_if_open();
}

function open_entry_modal(id) {
  const overlay = document.createElement('div');
  overlay.className = 'entry-modal-overlay';

  const box = document.createElement('div');
  box.className = 'entry-modal-box';

  const textarea = document.createElement('textarea');
  textarea.className = 'entry-modal-textarea';
  textarea.value = entryData[id] || '';

  const actions = document.createElement('div');
  actions.className = 'entry-modal-actions';

  const closeBtn = document.createElement('button');
  closeBtn.className = 'entry-modal-close';
  closeBtn.textContent = 'ZATVORIT';
  closeBtn.onclick = () => document.body.removeChild(overlay);

  const saveBtn = document.createElement('button');
  saveBtn.className = 'entry-modal-save';
  saveBtn.textContent = 'ULOZIT';
  saveBtn.onclick = () => {
    write_to_entry(id, textarea.value);
    document.body.removeChild(overlay);
  };

  actions.appendChild(closeBtn);
  actions.appendChild(saveBtn);
  box.appendChild(textarea);
  box.appendChild(actions);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  textarea.focus();
}

document.querySelectorAll('.entry-cell').forEach(cell => {
  const id = cell.getAttribute('data-entry-id');
  cell.addEventListener('click', () => open_entry_modal(id));
});
// === [/F1:CELL-LOGIC] ===

// === [Zzz1-D1:DB-WRITE] zapis celeho riadku entries (vsetky bunky command line) do Supabase | Vrso -> Claude AI | 2026-08-17 ===
// D1 = funkcia tykajuca sa databazy/modulu (nie jednej bunky) - berie VSETKY aktualne registrovane entries naraz.
// AKTIVOVANY realny zapis do Supabase (predtym bol len console.log placeholder, preto sa zaznamy predtym
// nikam neukladali). Schema tabulky 'verso_entries' zatial pocita len so stlpcom pre R1 (entry_id + r1);
// dalsie command line bunky (R2, R3...) sa doplnia rovnakym sposobom, az pribudnu.
// === [Zzz6-F2:AUTO-NUMBER] automaticke cislovanie entry_id + duplicate check | Vrso -> Claude AI | 2026-08-17 ===
// Ked sa CL prida do databazy, entry_id uz nie je pevne "1", ale sa dopocita ako
// (najvyssie doteraz priradene cislo entry_id v databaze) + 1.
// Ak je CL (po orezani whitespace) zhodne s uz existujucim zaznamom, novy zaznam sa NEPRIDA
// a zobrazi sa kratke kontextove upozornenie (~1 sekunda).

// kratke kontextove okno/toast, zmizne samo po ~1 sekunde
function zzz6f2_show_toast(message) {
  const toast = document.createElement('div');
  toast.textContent = message;
  toast.style.position = 'fixed';
  toast.style.top = '16px';
  toast.style.left = '50%';
  toast.style.transform = 'translateX(-50%)';
  toast.style.backgroundColor = '#171717';
  toast.style.color = '#fff';
  toast.style.padding = '8px 14px';
  toast.style.borderRadius = '8px';
  toast.style.fontSize = '11px';
  toast.style.fontWeight = '700';
  toast.style.zIndex = '2000';
  toast.style.boxShadow = '0 2px 8px rgba(0,0,0,0.3)';
  toast.style.maxWidth = '80%';
  toast.style.textAlign = 'center';
  document.body.appendChild(toast);
  setTimeout(() => {
    if (toast.parentNode) toast.parentNode.removeChild(toast);
  }, 1000);
}

// vsetky zname zaznamy [{entry_id, text}] - skusi Supabase (s timeoutom 4s), fallback lokalna cache
async function zzz6f2_get_known_entries() {
  try {
    const fetchPromise = sb.from('verso_entries').select('entry_id, r1');
    const timeoutPromise = new Promise((_, reject) =>
      setTimeout(() => reject(new Error('zzz6-F2 Supabase fetch timeout (4s)')), 4000)
    );
    const { data, error } = await Promise.race([fetchPromise, timeoutPromise]);
    if (error) throw error;
    return (data || []).map(row => ({ entry_id: row.entry_id, text: row.r1 || '' }));
  } catch (err) {
    console.warn('zzz6-F2 Supabase fetch zlyhal/timeout, pouzivam lokalnu cache pre cislovanie/duplicity:', err);
    return Object.entries(submittedEntriesCache).map(([entry_id, text]) => ({ entry_id, text: text || '' }));
  }
}

// posledne priradene cislo entry_id v databaze + 1
function zzz6f2_compute_next_entry_id(knownEntries) {
  let maxId = 0;
  knownEntries.forEach(({ entry_id }) => {
    const n = parseInt(entry_id, 10);
    if (!isNaN(n) && n > maxId) maxId = n;
  });
  return String(maxId + 1);
}

// vrati existujuci zaznam, ak je CL text zhodny (po orezani whitespace) s uz ulozenym zaznamom
function zzz6f2_find_duplicate(knownEntries, text) {
  const normalized = (text || '').trim();
  if (!normalized) return null;
  return knownEntries.find(e => (e.text || '').trim() === normalized) || null;
}

// zobrazi priradene entry number na R1a buttone
function zzz6f2_update_entry_number_button(entryId) {
  const btn = document.getElementById('versoEntryNumberButton');
  if (!btn) return;
  btn.textContent = `ENTRY NUMBER #${entryId}`;
}
// === [/Zzz6-F2:AUTO-NUMBER] ===

async function submit_entries_to_db() {
  const clText = entryData["1"] || "";

  // Zzz6-F2: najprv zisti zname zaznamy (potrebne pre cislovanie aj kontrolu duplicity)
  const knownEntries = await zzz6f2_get_known_entries();

  // Zzz6-F2: ak je CL zhodne s uz existujucim zaznamom, neprida sa znova - iba kratke upozornenie
  const duplicate = zzz6f2_find_duplicate(knownEntries, clText);
  if (duplicate) {
    zzz6f2_show_toast(`Zaznam uz existuje (#${duplicate.entry_id})`);
    return;
  }

  // Zzz6-F2: entry_id = posledne priradene cislo v databaze + 1 (uz nie pevne "1")
  const nextEntryId = zzz6f2_compute_next_entry_id(knownEntries);

  const payload = {
    entry_id: nextEntryId,      // Zzz6-F2: automaticky priradene cislo (max existujuceho +1)
    r1: clText,                 // obsah R1 command line bunky
    updated_at: new Date().toISOString()
  };
  console.log('Zzz1-D1 submit_entries_to_db - payload pripraveny na zapis:', payload);

  // Lokalna cache sa aktualizuje HNED (nezavisle od Supabase) - vdaka tomu je zaznam vidiet
  // v Database workspace okamzite, aj ked sietovy zapis zlyhava/beri dlhsie (napr. chybajuca RLS politika).
  submittedEntriesCache[payload.entry_id] = payload.r1;
  zzz6f2_update_entry_number_button(payload.entry_id); // Zzz6-F2: vyznacenie priradeneho cisla na R1a
  refresh_database_workspace_if_open();

  try {
    const { data, error } = await sb
      .from('verso_entries')
      .upsert(payload, { onConflict: 'entry_id' })
      .select();

    if (error) {
      console.error('Zzz1-D1 Supabase error (zapis do vzdialenej DB zlyhal, lokalne je ale ulozene):', error);
      // Najcastejsie priciny: 1) tabulka 'verso_entries' este neexistuje,
      // 2) chybaju stlpce entry_id/r1/updated_at, 3) RLS politika neumoznuje insert/update pre anon kluc.
      return;
    }

    console.log('Zzz1-D1 Supabase zapis uspesny:', data);
  } catch (err) {
    console.error('Zzz1-D1 neocakavana chyba pri zapise (lokalne je ale ulozene):', err);
  }
}

// Trigger 1: klavesa Enter (nie vnutri modal textarea, tam Enter iba pridava riadok textu)
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
    submit_entries_to_db();
  }
});

// Zzz6-F2: podrzanie 3 sekundy (predtym 600ms) - podla poziadavky "podrzanim 3 sekund home button"
(function bindLongPressD1() {
  const logoBtn = document.getElementById('versoEntryButton');
  if (!logoBtn) return;
  let pressTimer = null;
  const LONG_PRESS_MS = 3000; // Zzz6-F2: 3 sekundy

  const startPress = () => {
    pressTimer = setTimeout(() => {
      submit_entries_to_db();
    }, LONG_PRESS_MS);
  };
  const cancelPress = () => {
    if (pressTimer) clearTimeout(pressTimer);
  };

  logoBtn.addEventListener('mousedown', startPress);
  logoBtn.addEventListener('touchstart', startPress);
  logoBtn.addEventListener('mouseup', cancelPress);
  logoBtn.addEventListener('mouseleave', cancelPress);
  logoBtn.addEventListener('touchend', cancelPress);
})();
// === [/Zzz1-D1:DB-WRITE] ===

// === zzz6-F4 CL (command line R1) ako filter databazovych zaznamov | Vrso -> Claude AI | 2026-08-17 ===
// FILTER: obsah R1 bunky (entryData["1"]) funguje ako live filter - zobrazia sa iba zaznamy,
// ktorych text obsahuje aktualnu hodnotu R1 (bez ohladu na velke/male pismena). Prazdna R1 = zobrazi vsetko.
// R1 tu sluzi VYLUCNE ako filter/vyhladavanie - skutocne ulozene zaznamy su oddelene v submittedEntriesCache,
// takze mazanie/prepisovanie R1 kvoli hladaniu uz nezmaze samotny ulozeny zaznam (viz zzz2-R29 fix).
function get_active_filter_text() {
  return (entryData["1"] || "").trim().toLowerCase();
}

function row_matches_filter(rowText, filterText) {
  if (!filterText) return true;
  return (rowText || "").toLowerCase().includes(filterText);
}
// === end zzz6-F4 (filter funkcie) ===

// === zzz2-R29 Database button - otvorenie Database workspace + nacitanie vsetkych command lines | Vrso -> Claude AI | 2026-08-17 ===
// Po stlaceni DATABASE buttonu: otvori link na oznacenie #zzz2-r29-database-workspace
// a do WORKSPACE sekcie (zatial vizualne ako homepage) nacita vsetky doteraz vlozene command lines.
async function open_database_workspace() {
  const workspace = document.getElementById('versoWorkspaceSection');
  if (!workspace) return;

  workspace.innerHTML = '<div class="db-workspace"><div class="db-workspace-title">DATABASE WORKSPACE</div><div class="db-workspace-loading">Nacitavam command lines...</div></div>';

  // Vsetky command lines = riadky z Supabase tabulky 'verso_entries' (ak uz existuju),
  // s fallbackom na submittedEntriesCache (SKUTOCNE ulozene zaznamy, nie live obsah R1),
  // kym schema/tabulka nie je finalna (viz Zzz1-D1).
  // Timeout 4s zabranuje tomu, aby workspace zostal navzdy "Nacitavam..." pri pomalej/zlyhavajucej sieti.
  let rows = [];
  let usedFallback = false;
  try {
    const fetchPromise = sb.from('verso_entries').select('*');
    const timeoutPromise = new Promise((_, reject) =>
      setTimeout(() => reject(new Error('zzz2-R29 Supabase fetch timeout (4s)')), 4000)
    );
    const { data, error } = await Promise.race([fetchPromise, timeoutPromise]);
    if (error) throw error;
    rows = data || [];
  } catch (err) {
    console.warn('zzz2-R29 Supabase fetch zlyhal/timeout, pouzivam lokalne ulozene command lines:', err);
    usedFallback = true;
    rows = Object.entries(submittedEntriesCache)
      .filter(([, text]) => text && text.length > 0)
      .map(([id, text]) => ({ entry_id: id, text }));
  }

  // === zzz6-F4 aplikacia filtra na nacitane riadky (CL/R1 = filter) ===
  const totalCount = rows.length;
  const filterText = get_active_filter_text();
  const filteredRows = rows.filter(row => {
    const rowText = usedFallback ? row.text : (row.r1 !== undefined ? row.r1 : JSON.stringify(row));
    return row_matches_filter(rowText, filterText);
  });
  // === end zzz6-F4 (aplikacia filtra) ===

  const wrap = document.createElement('div');
  wrap.className = 'db-workspace';

  const title = document.createElement('div');
  title.className = 'db-workspace-title';
  // === zzz6-F4 titulok zobrazuje aktivny filter, ak je nastaveny ===
  title.textContent = filterText
    ? `DATABASE WORKSPACE (filter: "${entryData["1"]}")`
    : 'DATABASE WORKSPACE';
  // === end zzz6-F4 (titulok) ===
  wrap.appendChild(title);

  if (filteredRows.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'db-workspace-empty';
    empty.textContent = totalCount === 0
      ? 'Ziadne command lines zatial neboli vlozene.'
      : 'Ziadny zaznam nezodpoveda aktualnemu filtru (R1).';
    wrap.appendChild(empty);
  } else {
    const rowsWrap = document.createElement('div');
    rowsWrap.className = 'db-workspace-rows';

    filteredRows.forEach(row => {
      const entryId = usedFallback ? row.entry_id : (row.entry_id !== undefined ? row.entry_id : '?');
      const rowText = usedFallback ? row.text : (row.r1 !== undefined ? row.r1 : JSON.stringify(row));

      const rowEl = document.createElement('div');
      rowEl.className = 'db-workspace-row';

      // label = rovnaky vzhlad ako R1a (oznacenie entry number)
      const label = document.createElement('div');
      label.className = 'db-workspace-label';
      label.textContent = `#${entryId}`;

      // cell = rovnaka velkost/styl ako R1 (command line bunka), klik zobrazi plny text
      const cell = document.createElement('div');
      cell.className = 'db-workspace-cell';
      cell.textContent = rowText;
      cell.addEventListener('click', () => open_db_record_modal(entryId, rowText));

      rowEl.appendChild(label);
      rowEl.appendChild(cell);
      rowsWrap.appendChild(rowEl);
    });

    wrap.appendChild(rowsWrap);
  }

  workspace.innerHTML = '';
  workspace.appendChild(wrap);
}

// Read-only modal pre zobrazenie plneho textu databazoveho zaznamu (rovnaky vizual ako entry-modal)
function open_db_record_modal(entryId, fullText) {
  const overlay = document.createElement('div');
  overlay.className = 'entry-modal-overlay';

  const box = document.createElement('div');
  box.className = 'entry-modal-box';

  const label = document.createElement('div');
  label.style.fontSize = '9px';
  label.style.fontWeight = '700';
  label.style.color = '#171717';
  label.textContent = `Entry #${entryId}`;

  const textarea = document.createElement('textarea');
  textarea.className = 'entry-modal-textarea';
  textarea.value = fullText || '';
  textarea.readOnly = true;

  const actions = document.createElement('div');
  actions.className = 'entry-modal-actions';

  const closeBtn = document.createElement('button');
  closeBtn.className = 'entry-modal-close';
  closeBtn.textContent = 'ZATVORIT';
  closeBtn.onclick = () => document.body.removeChild(overlay);

  actions.appendChild(closeBtn);
  box.appendChild(label);
  box.appendChild(textarea);
  box.appendChild(actions);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

// Obnovi Database workspace iba ak je prave otvoreny (t.j. uz obsahuje .db-workspace),
// aby sa filter podla R1 aplikoval live bez toho, aby sa workspace otvoril, ked nie je vidiet.
function refresh_database_workspace_if_open() {
  const workspace = document.getElementById('versoWorkspaceSection');
  if (!workspace) return;
  if (workspace.querySelector('.db-workspace')) {
    open_database_workspace();
  }
}

(function bindR29DatabaseButton() {
  const dbBtn = document.getElementById('versoDatabaseButton');
  if (!dbBtn) return;
  dbBtn.addEventListener('click', () => {
    // open link do oznacenia zzz2-r29
    window.location.hash = 'zzz2-r29-database-workspace';
    open_database_workspace();
  });
})();
// === end zzz2-R29 (Database workspace) ===
