<!-- 
  VERSO SYSTEM — PRAVIDLA PRE CLAUDE (citaj pred kazdym requestom!)

  1. Po kazdom requeste: vypis kod ako TEXT v chate (nie artifact), VZDY aj s aktualizovanym PREVIEW.

  2. Znacky v kode (NIKDY nemen Vrsove vlastne oznacenie requestov, iba ich chapaj takto):
     - zzz   = symbol, aby sa dal konkretny request VELMI LAHKO A PRESNE najst v kode (hlavny/najcastejsi typ znacky)
     - !zzz  = nedoriesene / ma sa nechat na neskor (pouziva sa zriedka)
     - eee   = experimentalny request (pouziva sa zriedka, len ak treba nieco vyskusat)
     - zz    = (2 pismena zamerne) oznacuje funkcie urcene na vyhladanie a mozne skopirovanie/pouzitie inde v systeme

  3. Requesty/znacenia (R-ID, nazvy, format) Claude NIKDY nerieši a NIKDY nemeni. Vrso ich sam zadava aj kontroluje — Claude ich len cita a pouziva presne take, ake su.

  4. Moduly (C-1/L-2/B-3/D-4/T-5...) zatial nie su striktne vynucovane, len maj na pameti ze existuju
     a niektore cele moduly/bloky kodu sa neskor budu mozno kopirovat/presuvat medzi sebou.

  5. Stav DONE/TESTED — pracovny postup:
     a) Vrso posle aktualny index.html
     b) Claude navrhne kod + preview
     c) Vrso kod zapracuje/ulozi a posle spat aktualizovany index.html
     d) Claude skontroluje a bud potvrdi "TESTED", alebo napise konkretnu chybu

  6. Ak si Claude vsimne chybu, nekonzistenciu, alebo nieco podozrive v kode (aj mimo aktualneho requestu),
     upozorni na to VOPRED a CO NAJSKOR, necakaj na explicitnu otazku.
-->
