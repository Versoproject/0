<!-- zzz2-M1 layout modul - CSS pre sekcie (CORE/SYSTEM/DATA/WORKSPACE) | Vrso -> Claude AI | 2026-08-16 -->
<style>
  .section {
    margin-bottom: 12px;
  }
  .top-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 8px 6px 0 6px;
  }
  .section-core, .section-system {
    flex-shrink: 0;
  }
  .section-data {
    flex-shrink: 1;
    padding-top: 4px;
  }
  .section-workspace {
    display: block;
  }

  .circle-layout {
    position: relative;
    width: 168px;
    height: 140px;
  }
  .circle-layout .circle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background-color: #0a0a0a;
    background-image: url("verso-chain.jpg");
    background-size: cover;
    background-position: center;
    border: none;
    cursor: pointer;
  }
  .section-core .circle {
    width: 80px;
    height: 80px;
  }
  .section-system .circle-layout {
    width: 180px;
    height: 140px;
  }
  .section-system .circle {
    width: 64px;
    height: 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    color: #fff;
    font-size: 8px;
    font-weight: 700;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
  }

  .circle-layout button {
    position: absolute;
    top: 50%;
    left: 50%;
    height: 22px;
    padding: 0 4px;
    border-radius: 5px;
    background-color: #171717;
    border: none;
    color: #fff;
    font-size: 7px;
    font-weight: 700;
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .section-core .pos-top        { transform: translate(-50%, -50%) translate(0px, -62px); }
  .section-core .pos-top-right  { transform: translate(-50%, -50%) translate(46px, -46px); }
  .section-core .pos-right      { transform: translate(-50%, -50%) translate(62px, 0px); }
  .section-core .pos-bottom-right { transform: translate(-50%, -50%) translate(46px, 46px); }
  .section-core .pos-bottom     { transform: translate(-50%, -50%) translate(0px, 62px); }
  .section-core .pos-bottom-left  { transform: translate(-50%, -50%) translate(-46px, 46px); }
  .section-core .pos-left       { transform: translate(-50%, -50%) translate(-62px, 0px); }
  .section-core .pos-top-left   { transform: translate(-50%, -50%) translate(-46px, -46px); }

  .section-system .pos-top        { transform: translate(-50%, -50%) translate(0px, -54px); }
  .section-system .pos-top-right  { transform: translate(-50%, -50%) translate(50px, -42px); }
  .section-system .pos-right      { transform: translate(-50%, -50%) translate(68px, 0px); }
  .section-system .pos-bottom-right { transform: translate(-50%, -50%) translate(50px, 42px); }
  .section-system .pos-bottom     { transform: translate(-50%, -50%) translate(0px, 54px); }
  .section-system .pos-bottom-left  { transform: translate(-50%, -50%) translate(-50px, 42px); }
  .section-system .pos-left       { transform: translate(-50%, -50%) translate(-68px, 0px); }
  .section-system .pos-top-left   { transform: translate(-50%, -50%) translate(-50px, -42px); }

  .section-system .pos-top-right {
    visibility: visible;
  }

  .data-row {
    display: flex;
    flex-wrap: nowrap;
    gap: 4px;
  }
  .data-row button {
    height: 32px;
    padding: 0 6px;
    border-radius: 6px;
    background-color: #171717;
    border: none;
    color: #fff;
    font-size: 8px;
    font-weight: 700;
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .section-workspace.editable {
    min-height: 20px;
  }

  .module-bar {
    display: none;
  }
</style>
